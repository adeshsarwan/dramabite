def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.dramabite.thebes.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.dramamunch.thebes.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "ADJUST_TOKEN", "\"2v3cvdn37bls\""
        buildConfigField "String", "FACEBOOK_APP_ID", "\"1509974191032436\""
        buildConfigField "String", "ADJUST_EVENT_AD_REVENUE", "\"jupb02\""
        buildConfigField "String", "ADJUST_EVENT_PURCHASE", "\"2k8qw3\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing secrets live in keystore.properties + the .jks file, both git-ignored.
    // Keep them on the build machine only (see keystore.properties.example).
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "AD_ENVIRONMENT", "\"develop\""
        }
        release {
            buildConfigField "String", "AD_ENVIRONMENT", "\"production\""
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures{
        viewBinding = true
        compose = true
        buildConfig = true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

