name: Android build

on:
  push:
    branches: ["app/**", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: |
          if [ -z "$GPR_TOKEN" ]; then
            echo "::error::Add GPR_USER and GPR_TOKEN in Settings > Secrets and variables > Actions"
            exit 1
          fi
          printf 'gpr.user=%s\ngpr.token=%s\n' "$GPR_USER" "$GPR_TOKEN" > local.properties
          # Show whether this token can see The Arrows packages (no secrets printed)
          for p in FirstOpenTutorial/com/tutorial/tutorial/maven-metadata.xml AdsSdk/com/arrows/ads/ads/maven-metadata.xml; do
            code=$(curl -s -o /tmp/meta.xml -w '%{http_code}' -u "$GPR_USER:$GPR_TOKEN" "https://maven.pkg.github.com/The-Arrows-JSC/$p")
            echo "GitHub Packages $p -> HTTP $code"; grep -o '<version>[^<]*</version>' /tmp/meta.xml | tail -5 || true
          done
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
